<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quote Generator</title>
</head>
<body>
    <div id="boxQuote">
        <p id = "quoteCont"></p>
        <p id= "autCont"></p>
    </div>
    <button id ="btnQuote">Get Quote</button> 

    
    <form id="quoteForm">
        <fieldset>
            <legend>Add Your Favorite Quotes</legend>

            <div id = "authorContent">
                <label for="author"> Author Name :</label> <br>
                <input type="text" id="author" placeholder="Type Author Name" required/>
            </div>
            <div id = "quoteContent">
                <label for="quote"> Quote : </label> <br>
                <textarea id="quote" placeholder="Type your Quote......" required></textarea>
            </div>
    
            <button type="submit" >Submit Quote</button>
        </fieldset>      
    </form>
    <p id="statusMsg"></p>
    <script src="script.js"></script> 
</body>
</html>
